<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#d84a1b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Maish Fashion" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Maish Fashion" />
    <meta name="msapplication-TileColor" content="#d84a1b" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- SEO Meta Tags -->
    <title>Maish Fashion Boutique - Kenya's Premier Fashion Destination</title>
    <meta name="description" content="Maish Fashion Boutique - Kenya's Premier Fashion Destination. Shop Women Wear, Men Wear, Kids Wear, Work Wear, Uniforms, Accessories & More. Quality fashion at affordable prices." />
    <meta name="author" content="Maish Fashion Boutique" />
    <meta name="robots" content="index, follow" />
    <!-- Canonical host is https://maishfashionboutique.co.ke, NOT the Netlify
         deployment preview. Per-route canonicals are written at runtime by
         src/lib/seo.ts; this is the pre-hydration value for the homepage. -->
    <link rel="canonical" href="https://maishfashionboutique.co.ke/" />
    <link rel="alternate" hreflang="en-KE" href="https://maishfashionboutique.co.ke/" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Maish Fashion Boutique" />
    <meta property="og:title" content="Maish Fashion Boutique - Kenya's Premier Fashion Destination" />
    <meta property="og:description" content="Shop Women Wear, Men Wear, Kids Wear, Work Wear, Uniforms & More. Quality fashion at affordable Kenyan prices." />
    <meta property="og:url" content="https://maishfashionboutique.co.ke/" />
    <meta property="og:locale" content="en_KE" />
    <meta property="og:image" content="https://maishfashionboutique.co.ke/App-icon.webp" />
    <meta property="og:image:alt" content="Maish Fashion Boutique" />
    <meta property="og:image:width" content="3508" />
    <meta property="og:image:height" content="2480" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Maish Fashion Boutique" />
    <meta name="twitter:description" content="Kenya's Premier Fashion Destination" />
    <meta name="twitter:image" content="https://maishfashionboutique.co.ke/App-icon.webp" />
    <meta name="twitter:image:alt" content="Maish Fashion Boutique" />
    
    <!-- Icons -->
    <link rel="icon" type="image/webp" href="/App-icon.webp" />
    <link rel="apple-touch-icon" href="/App-icon.webp" />
    <link rel="mask-icon" href="/App-icon.webp" color="#d84a1b" />
    <!-- No manifest link is written here on purpose: vite-plugin-pwa
         generates /manifest.webmanifest from the `manifest` block in
         vite.config.ts and injects the link automatically. A second,
         hand-written link used to sit alongside it, and two manifest links
         make the browser pick one non-deterministically, which was part of
         why the install prompt never fired. The old /manifest.json file has
         been deleted for the same reason. -->
    
    <!-- Font Preloads - Optimize font loading for FCP/LCP -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" /></noscript>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    
    <!-- Hero Image Preload - Critical for LCP -->
    <link rel="preload" as="image" href="/images/HERO-IMAGE.webp" fetchpriority="high" />
    
    <!-- Google Analytics -->
    <script defer src="https://www.googletagmanager.com/gtag/js?id=G-LZGZ2XTVCH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LZGZ2XTVCH');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
